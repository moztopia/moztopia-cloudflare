name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.paths.outputs.package }}
      example: ${{ steps.paths.outputs.example }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect changed paths
        id: paths
        shell: sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          package=false
          example=false
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            package=true
            example=true
          else
            changed_paths="$RUNNER_TEMP/cloudflare-changed-paths"
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
            while IFS= read -r path; do
              case "$path" in
                *.md)
                  ;;
                src/*|config/*|tests/*|composer.json|composer.lock|phpunit.xml|pint.json|.github/workflows/ci.yaml)
                  package=true
                  example=true
                  ;;
                examples/website/*|.dockerignore)
                  example=true
                  ;;
              esac
            done < "$changed_paths"
          fi
          printf 'package=%s\nexample=%s\n' "$package" "$example" >> "$GITHUB_OUTPUT"

  package:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4.27', '8.5.12', '8.5.13']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve the selected framework and PHP platform
        shell: sh
        env:
          MATRIX_PHP: ${{ matrix.php }}
          MATRIX_TESTBENCH: ${{ matrix.testbench }}
        run: |
          set -eu
          package_version=$(cat VERSION)
          docker run --rm --user "$(id -u):$(id -g)" \
            -e COMPOSER_HOME=/tmp/cloudflare-composer \
            -e "COMPOSER_ROOT_VERSION=$package_version" \
            -e MATRIX_PHP -e MATRIX_TESTBENCH \
            -v "$PWD:/workspace/package" -w /workspace/package composer:2 sh -ec '
              composer config platform.php "$MATRIX_PHP"
              composer require --dev "orchestra/testbench:^$MATRIX_TESTBENCH.0" --no-update --no-interaction
              composer update --no-interaction --no-progress --no-scripts --prefer-dist --no-audit
              composer validate --strict
            '
      - name: Verify the actual runtime, tests and formatting
        shell: sh
        env:
          MATRIX_PHP: ${{ matrix.php }}
        run: |
          set -eu
          docker run --rm --user "$(id -u):$(id -g)" -e MATRIX_PHP \
            -v "$PWD:/workspace/package" -w /workspace/package \
            "php:$MATRIX_PHP-cli-bookworm" sh -ec '
              php -r '\''if (PHP_VERSION !== getenv("MATRIX_PHP")) { fwrite(STDERR, "Unexpected PHP version\n"); exit(1); }'\''
              php vendor/bin/pest --colors=never
              php vendor/bin/pint --test
            '

  example:
    name: Example / PHP 8.5.13
    needs: changes
    if: needs.changes.outputs.example == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build locked dependencies and browser assets
        working-directory: examples/website
        run: docker compose build website
      - name: Verify the example runtime and application
        working-directory: examples/website
        shell: sh
        run: |
          set -eu
          docker compose run --rm website php -r 'if (PHP_VERSION !== "8.5.13") { exit(1); }'
          docker compose run --rm website composer validate --strict
          docker compose run --rm website composer test
          docker compose run --rm website composer lint
          docker compose up -d --wait website
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/
      - name: Stop the isolated example
        if: always()
        working-directory: examples/website
        run: docker compose down --remove-orphans

  checks:
    name: CI result
    needs: [changes, package, example]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected check to pass
        shell: sh
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          EXAMPLE_RESULT: ${{ needs.example.result }}
        run: |
          set -eu
          if [ "$CHANGES_RESULT" != success ]; then
            exit 1
          fi
          for result in "$PACKAGE_RESULT" "$EXAMPLE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
